model:
  model_type: Codec
  params:
    time: 999
    codec_mode: 'self_dist'
    DiT_mode: 'scale'
    dit_path: "src/models/sana"
    elic_path: null
    codec_path: "src/models/checkpoints/q3_merge_ema.pt"
    use_ema: true
    use_merge: true
    training: false
    DiT_params:
      DiT: true
      DiT_lora: true
      lora_rank_DiT: 128
      lora_alpha_DiT: 128
      channel_in: 32
    vae_params:
      vae_lora: true
      lora_rank_vae: 64
      lora_alpha_vae: 64
    codec_param:
      ch_emd: 32
      channel: 320
      channel_out: 32
      num_slices: 5
      max_support_slices: 5
      kernel_size: 3
      drop_path_rate: 0.1
      depths: [2, 2, 2, 2, 2]
      num_heads: [16, 16, 16, 16, 16]
    loss_params:
      pp_style: true
      pixelloss_weight: 1.0
      perceptual_weight: 1.0
      kl_weight: 0.1
      disc_start: 0
      disc_weight: 0.5
      use_vf: null
      latent: false
      reverse_proj: true
      vf_weight: 0.1
      adaptive_vf: true
      distmat_margin: 0.25
      cos_margin: 0.5
